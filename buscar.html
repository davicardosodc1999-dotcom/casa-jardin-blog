<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Buscar artículos | Casa & Jardín
    </title>

    <meta
        name="description"
        content="Busca artículos, consejos e ideas sobre hogar, jardinería, plantas y decoración en Casa & Jardín."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/search.css"
    >

</head>

<body>


<main>

<section class="section">

    <div class="container">

        <span class="eyebrow">
            BUSCADOR
        </span>

        <h1>
            Encuentra lo que estás buscando
        </h1>

        <form
            class="search-page-form"
            id="search-page-form"
        >

            <input
                type="search"
                id="search-page-input"
                placeholder="Buscar artículos..."
                aria-label="Buscar artículos"
            >

            <button
                type="submit"
                class="button"
            >
                Buscar
            </button>

        </form>


        <div
            id="search-results"
            class="search-results"
        >

            <p>
                Escribe una palabra o tema para comenzar
                tu búsqueda.
            </p>

        </div>

    </div>

</section>

</main>


<footer class="site-footer">

    <div class="container footer-bottom">

        <p>
            © 2026 Casa & Jardín. Todos los derechos reservados.
        </p>

    </div>

</footer>


<script src="js/script.js"></script>
<script src="js/articles.js"></script>

<script src="js/search.js"></script>

</body>

</html>
