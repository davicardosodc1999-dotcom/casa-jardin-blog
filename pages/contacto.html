<!DOCTYPE html>
<html lang="es">

<head>
    

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contacto | Casa & Jardín</title>

    <meta
        name="description"
        content="Ponte en contacto con el equipo de Casa & Jardín."
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <a
            href="../index.html"
            class="logo"
        >
            Casa <span>&</span> Jardín
        </a>

        <nav class="main-nav">

            <a href="../index.html">
                Inicio
            </a>

            <a href="../index.html#categorias">
                Categorías
            </a>

            <a href="sobre-nosotros.html">
                Sobre nosotros
            </a>

            <a href="contacto.html">
                Contacto
            </a>

        </nav>

    </div>

</header>


<main>

<section class="section">

    <div class="container">

        <span class="eyebrow">
            CONTACTO
        </span>

        <h1>
            Estamos aquí para escucharte
        </h1>

        <p>
            ¿Tienes una pregunta, sugerencia o quieres
            comunicarte con nosotros? Puedes utilizar
            el formulario de esta página.
        </p>


        <form
            class="contact-form"
            action="#"
            method="post"
        >

            <label for="nombre">
                Nombre
            </label>

            <input
                id="nombre"
                name="nombre"
                type="text"
                required
            >


            <label for="email">
                Correo electrónico
            </label>

            <input
                id="email"
                name="email"
                type="email"
                required
            >


            <label for="asunto">
                Asunto
            </label>

            <input
                id="asunto"
                name="asunto"
                type="text"
                required
            >


            <label for="mensaje">
                Mensaje
            </label>

            <textarea
                id="mensaje"
                name="mensaje"
                rows="7"
                required
            ></textarea>


            <button
                type="submit"
                class="button"
            >
                Enviar mensaje
            </button>

        </form>

    </div>

</section>

</main>


<footer class="site-footer">

    <div class="container footer-bottom">

        <p>
            © 2026 Casa & Jardín. Todos los derechos reservados.
        </p>

    </div>

</footer>

</body>

</html>
